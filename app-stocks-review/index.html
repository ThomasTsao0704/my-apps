<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易 Journal Pro</title>
<style>
  :root{
    --bg:#0F1621; --surface:#161F2E; --surface-2:#1D2838; --raised:#222F42;
    --line:#27334699; --line-solid:#273346; --ink:#E9EEF5; --muted:#8B98AB; --faint:#5A6678;
    --gold:#D9A24C; --gold-dim:#B7863a; --win:#4FB286; --loss:#E06C6C; --info:#5E9BD6;
    --radius:10px; --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,monospace;
    --sans:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  a{color:inherit}
  button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-solid);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── shell ── */
  .app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
  .rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px}
  .brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(150deg,var(--gold),var(--gold-dim));display:grid;place-items:center;color:#1a130a;font-weight:800;flex:none}
  .brand h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em}
  .brand small{display:block;color:var(--faint);font-size:11px;font-weight:400;margin-top:1px}
  nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .nav-btn{display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;background:transparent;border-radius:8px;color:var(--muted);text-align:left;transition:background .12s,color .12s;position:relative;font-size:13.5px}
  .nav-btn svg{width:18px;height:18px;flex:none;opacity:.9}
  .nav-btn:hover{background:var(--surface-2);color:var(--ink)}
  .nav-btn.active{color:var(--ink);background:var(--surface-2)}
  .nav-btn.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
  .rail-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line)}
  .conn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);width:100%;padding:8px 10px;border:1px solid var(--line-solid);border-radius:8px;background:transparent}
  .conn:hover{background:var(--surface-2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .dot.ok{background:var(--win);box-shadow:0 0 0 3px #4fb28622}
  .dot.bad{background:var(--loss)}

  main{min-width:0;padding:26px 30px 60px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
  .head h2{margin:0;font-size:22px;font-weight:640;letter-spacing:.01em}
  .head p{margin:3px 0 0;color:var(--muted);font-size:13px}
  .head .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ── controls ── */
  .btn{border:1px solid var(--line-solid);background:var(--surface-2);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--raised)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#1a130a;font-weight:650}
  .btn.primary:hover{background:#e6b264}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--loss);border-color:#e06c6c44}
  .btn.danger:hover{background:#e06c6c14}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
  .seg{display:inline-flex;border:1px solid var(--line-solid);border-radius:8px;overflow:hidden;background:var(--surface)}
  .seg button{border:0;background:transparent;padding:7px 13px;font-size:12.5px;color:var(--muted)}
  .seg button.on{background:var(--surface-2);color:var(--ink)}
  .input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--line-solid);color:var(--ink);padding:9px 11px;border-radius:8px;outline:none;transition:border-color .12s}
  .input:focus{border-color:var(--gold)}
  textarea.input{resize:vertical;min-height:74px;line-height:1.55}
  label.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ── panels ── */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .panel-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .panel-h h3{margin:0;font-size:14px;font-weight:600}
  .panel-h .sub{color:var(--faint);font-size:12px}

  /* ── dashboard hero: equity curve ── */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .hero .netR{font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .hero .netR small{font-size:15px;color:var(--muted);font-weight:400;margin-left:8px;font-family:var(--sans)}
  .hero .cap{color:var(--muted);font-size:12.5px;margin-bottom:6px}
  .curve{margin-top:14px;width:100%;height:132px;display:block}
  .curve .zero{stroke:var(--line-solid);stroke-dasharray:3 4}
  .curve .base{stroke:var(--faint);stroke-width:1}

  /* ── ledger stat strip (not identical cards) ── */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
  .stat{padding:15px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat .k{color:var(--muted);font-size:12px;margin-bottom:7px}
  .stat .v{font-size:24px;font-weight:600;letter-spacing:-.01em}
  .stat .v.pos{color:var(--win)} .stat .v.neg{color:var(--loss)}
  .stat .x{font-size:11.5px;color:var(--faint);margin-top:3px}

  /* ── tables ── */
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;padding:11px 14px;border-bottom:1px solid var(--line-solid);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
  td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:0}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;border:1px solid var(--line-solid)}
  .pill.long{color:var(--win);border-color:#4fb28644;background:#4fb2860f}
  .pill.short{color:var(--loss);border-color:#e06c6c44;background:#e06c6c0f}
  .rcell.pos{color:var(--win)} .rcell.neg{color:var(--loss)}
  .rowact{display:flex;gap:4px;opacity:0;transition:opacity .12s}
  tr:hover .rowact{opacity:1}
  .iconbtn{border:0;background:transparent;color:var(--faint);padding:4px;border-radius:6px;line-height:0}
  .iconbtn:hover{background:var(--raised);color:var(--ink)}
  .iconbtn.del:hover{color:var(--loss)}
  .iconbtn svg{width:15px;height:15px}

  /* ── empty state ── */
  .empty{padding:56px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:8px;opacity:.5}
  .empty h4{margin:0 0 6px;color:var(--ink);font-weight:600;font-size:15px}
  .empty p{margin:0 0 16px;font-size:13px}

  /* ── forms grid ── */
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .field{min-width:0}
  .full{grid-column:1/-1}
  .toggle{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
  .toggle input{position:absolute;opacity:0;width:0;height:0}
  .track{width:38px;height:22px;border-radius:20px;background:var(--line-solid);position:relative;transition:background .15s;flex:none}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#cdd5e0;transition:transform .15s}
  .toggle input:checked + .track{background:var(--win)}
  .toggle input:checked + .track::after{transform:translateX(16px);background:#0f1621}

  /* score dots */
  .score{display:inline-flex;gap:5px}
  .score span{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-solid);display:grid;place-items:center;font-size:12px;color:var(--muted);cursor:pointer;transition:all .1s}
  .score span.on{background:var(--gold);border-color:var(--gold);color:#1a130a;font-weight:650}

  /* tag input */
  .tags{display:flex;flex-wrap:wrap;gap:7px;padding:8px;border:1px solid var(--line-solid);border-radius:8px;background:var(--bg);align-items:center}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line-solid);border-radius:7px;padding:4px 6px 4px 9px;font-size:12.5px}
  .tag .st{color:var(--gold);font-size:11px}
  .tag button{border:0;background:transparent;color:var(--faint);line-height:0;padding:2px;border-radius:4px}
  .tag button:hover{color:var(--loss)}
  .tags .tin{flex:1;min-width:90px;border:0;background:transparent;color:var(--ink);outline:none;padding:4px}

  /* ── modal ── */
  .scrim{position:fixed;inset:0;background:#080c12cc;backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .scrim.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line-solid);border-radius:14px;width:100%;max-width:660px;box-shadow:0 24px 60px #0009}
  .modal.wide{max-width:820px}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-h h3{margin:0;font-size:16px;font-weight:640}
  .modal-b{padding:22px}
  .modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}

  /* toast */
  .toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:80}
  .toast{background:var(--raised);border:1px solid var(--line-solid);border-left:3px solid var(--info);padding:12px 16px;border-radius:9px;font-size:13px;max-width:340px;box-shadow:0 8px 24px #0007;animation:tin .18s ease}
  .toast.ok{border-left-color:var(--win)} .toast.err{border-left-color:var(--loss)}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .hint{color:var(--faint);font-size:12px;margin-top:7px}
  .kbd{font-family:var(--mono);background:var(--bg);border:1px solid var(--line-solid);border-radius:5px;padding:1px 6px;font-size:12px}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);z-index:40;overflow-x:auto}
    .brand,.rail-foot{display:none}
    nav{flex-direction:row;padding:6px 8px;gap:2px}
    .nav-btn{flex-direction:column;gap:4px;font-size:10.5px;padding:7px 12px;white-space:nowrap}
    .nav-btn.active::before{left:8px;right:8px;top:0;bottom:auto;width:auto;height:3px}
    main{padding:18px 16px 90px}
    .g2,.g3{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">J</div>
      <div><h1>交易 Journal Pro</h1><small>紀律 · 過程 · 複盤</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <button class="conn" id="connBtn"><span class="dot" id="connDot"></span><span id="connTxt">尚未連線</span></button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
/* ══════════ 安全儲存（下載自用時持久化；沙盒中自動退回記憶體） ══════════ */
const store = {
  _m:{},
  get(k){ try{ const v=localStorage.getItem(k); return v===null?this._m[k]??null:v; }catch(e){ return this._m[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ this._m[k]=v; } },
};

/* ══════════ 與 Apps Script 對接 ══════════ */
const GS = {
  url(){ return (store.get('gs_url')||'').trim(); },
  token(){ return (store.get('gs_token')||'thomastsao').trim(); },
  _norm(u){ return u.replace(/\/+$/,''); },
  async get(params){
    if(!this.url()) throw new Error('尚未設定 Web App 網址');
    const u = new URL(this._norm(this.url()));
    Object.entries({...params, token:this.token()}).forEach(([k,v])=>{ if(v!=null) u.searchParams.set(k,v); });
    const r = await fetch(u.toString(), { method:'GET', redirect:'follow' });
    return this._parse(r);
  },
  async post(body){
    if(!this.url()) throw new Error('尚未設定 Web App 網址');
    // text/plain 屬「簡單請求」，避開 Apps Script 不處理的 CORS 預檢
    const r = await fetch(this._norm(this.url()), {
      method:'POST', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({...body, token:this.token()}),
    });
    return this._parse(r);
  },
  async _parse(r){
    const t = await r.text();
    let d; try{ d=JSON.parse(t); }catch(e){ throw new Error('回應非 JSON（多半是網址錯誤或未部署為「任何人」可存取）'); }
    if(d && d.ok===false) throw new Error(d.error||'後端回報錯誤');
    return d;
  },
  ping(){ return this.get({action:'ping'}); },
  list(kind){ return this.get({action:'list',kind}).then(d=>d.items||[]); },
  summary(p){ return this.get({action:'summary',...p}).then(d=>d.summary||{}); },
  upsert(kind,item){ return this.post({action:'upsert',kind,item}); },
  remove(kind,id){ return this.post({action:'delete',kind,id}); },
};

/* ══════════ 全域狀態 ══════════ */
const S = { view:'dash', connected:false, range:'all', curveMode:'R', monthMode:'R',
  data:{ trades:[], premarket:[], postmarket:[], journal:[] } };

/* ══════════ 小工具 ══════════ */
const $ = s=>document.querySelector(s);
const el = (t,a={},kids=[])=>{ const n=document.createElement(t);
  for(const k in a){ if(k==='class')n.className=a[k]; else if(k==='html')n.innerHTML=a[k]; else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]); else if(a[k]!=null)n.setAttribute(k,a[k]); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c))); return n; };
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayStr = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fnum = (n,d=2)=>{ if(n==null||n===''||isNaN(n))return '—'; const x=Number(n); return (x>0?'+':'')+x.toFixed(d); };
const fint = n=>(n==null||isNaN(n))?'—':String(n);
const fmoney = n=>{ if(n==null||n===''||isNaN(n))return '—'; const x=Math.round(Number(n)); return (x>0?'+':x<0?'−':'')+Math.abs(x).toLocaleString('en-US'); };
function toast(msg,kind=''){ const t=el('div',{class:'toast '+kind},esc(msg)); $('#toasts').append(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(6px)'; setTimeout(()=>t.remove(),200); },3200); }

/* R 值試算 */
function calcR(dir,entry,stop,exit){
  entry=+entry; stop=+stop; exit=+exit;
  if([entry,stop,exit].some(v=>isNaN(v)))return null;
  const risk = dir==='short' ? stop-entry : entry-stop;
  const reward = dir==='short' ? entry-exit : exit-entry;
  if(!risk || risk<=0) return null;
  return +(reward/risk).toFixed(2);
}

/* 從已載入的 trades 依日期範圍算統計（首頁用，離線即時） */
function rangeStart(){ const d=new Date(); if(S.range==='30')d.setDate(d.getDate()-30);
  else if(S.range==='90')d.setDate(d.getDate()-90); else if(S.range==='ytd')return `${d.getFullYear()}-01-01`;
  else return '0000-01-01'; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function filteredTrades(){ const from=rangeStart();
  return S.data.trades.filter(t=>String(t.date||'')>=from)
    .sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.created_at||'').localeCompare(String(b.created_at||''))); }
function filteredPostmarket(){ const from=rangeStart();
  return S.data.postmarket.filter(r=>String(r.date||'')>=from); }
function computeStats(rows){
  let n=0,w=0,l=0,be=0,rSum=0,rPos=0,rNeg=0,py=0,pt=0,best=null,worst=null;
  rows.forEach(t=>{ n++; const R=(t.rMultiple==null||t.rMultiple==='')?null:Number(t.rMultiple);
    if(R!=null&&!isNaN(R)){ rSum+=R; if(R>0){w++;rPos+=R;} else if(R<0){l++;rNeg+=R;} else be++;
      if(best==null||R>best)best=R; if(worst==null||R<worst)worst=R; }
    if(t.planFollowed===true||t.planFollowed===false){ pt++; if(t.planFollowed===true)py++; } });
  const dec=w+l;
  return { count:n,wins:w,losses:l,be, winRate:dec?+(w/dec*100).toFixed(1):0,
    rTotal:+rSum.toFixed(2), rAvg:n?+(rSum/n).toFixed(2):0,
    profitFactor:rNeg!==0?+(rPos/Math.abs(rNeg)).toFixed(2):null,
    planRate:pt?+(py/pt*100).toFixed(1):null, best,worst }; }

/* ══════════ 導覽 ══════════ */
const NAV=[
  ['dash','總覽', '<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>'],
  ['trades','交易紀錄', '<path d="M3 3v18h18M7 15l4-4 3 3 5-6"/>'],
  ['pre','盤前準備', '<path d="M12 2v6m0 0 3-3m-3 3L9 5M4 11h16v9H4z"/>'],
  ['post','盤後檢討', '<path d="M20 22V10m0 0-3 3m3-3 3 3M4 13h10M4 18h7M4 8h13"/>'],
  ['journal','交易日誌', '<path d="M4 3h13a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2z"/>'],
  ['month','月報表', '<path d="M3 21h18M6 21V9m4 12V5m4 16v-8m4 8V3"/>'],
];
function renderNav(){ const nav=$('#nav'); nav.innerHTML='';
  NAV.forEach(([id,label,path])=>{ const b=el('button',{class:'nav-btn'+(S.view===id?' active':''),
    onclick:()=>{ S.view=id; renderNav(); route(); }});
    b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${path}</svg><span>${label}</span>`;
    nav.append(b); }); }

/* ══════════ 連線 ══════════ */
function paintConn(){ const dot=$('#connDot'),txt=$('#connTxt');
  dot.className='dot'+(S.connected?' ok':(GS.url()?' bad':''));
  txt.textContent=S.connected?'已連線':(GS.url()?'連線失敗':'尚未連線'); }
async function reconnect(silent){
  if(!GS.url()){ S.connected=false; paintConn(); return; }
  try{ await GS.ping(); S.connected=true; paintConn();
    const [tr,pre,post,jr]=await Promise.all([GS.list('trades'),GS.list('premarket'),GS.list('postmarket'),GS.list('journal')]);
    S.data={trades:tr,premarket:pre,postmarket:post,journal:jr};
    if(!silent) toast('已同步 '+tr.length+' 筆交易','ok'); route();
  }catch(e){ S.connected=false; paintConn(); if(!silent) toast('連線失敗：'+e.message,'err'); route(); } }

/* ══════════ 路由 ══════════ */
function route(){ const v=$('#view'); v.innerHTML='';
  if(!GS.url()) return v.append(welcome());

function viewDash(root){
  const rows=filteredTrades(), st=computeStats(rows);
  const head=el('div',{class:'head'});
  head.innerHTML=`<div><h2>總覽</h2><p>${st.count?`區間內 ${st.count} 筆交易`:'尚無資料，先到交易紀錄新增第一筆'}</p></div>`;
  const seg=el('div',{class:'seg'});
  [['30','近 30 天'],['90','近 90 天'],['ytd','今年'],['all','全部']].forEach(([k,lab])=>{
    seg.append(el('button',{class:S.range===k?'on':'',onclick:()=>{S.range=k;route();}},lab)); });
  head.append(el('div',{class:'tools'},[seg])); root.append(head);

  // hero：權益曲線（可切換 金額 / R）
  const mode=S.curveMode, hero=el('div',{class:'hero'});
  const cum=[]; let capL,headL,unitL,capR,headR,unitR;
  if(mode==='amt'){
    const days=filteredPostmarket().filter(r=>r.pnl!=null&&!isNaN(r.pnl))
      .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    let run=0; days.forEach(r=>{ run+=Number(r.pnl); cum.push({d:r.date,v:run}); });
    const net=days.reduce((s,r)=>s+Number(r.pnl),0), avg=days.length?net/days.length:0;
    const c1=net>0?'var(--win)':net<0?'var(--loss)':'var(--ink)', c2=avg>0?'var(--win)':avg<0?'var(--loss)':'var(--ink)';
    capL='累積損益（區間，來自盤後每日 pnl）'; headL=`<span style="color:${c1}">${fmoney(net)}</span>`; unitL='淨損益';
    capR='平均每日損益'; headR=`<span style="color:${c2};font-size:26px">${fmoney(avg)}</span>`; unitR='／交易日';
  } else {
    let run=0; rows.forEach(t=>{ const R=Number(t.rMultiple); if(!isNaN(R)){run+=R; cum.push({d:t.date,v:run});} });
    const c1=st.rTotal>0?'var(--win)':st.rTotal<0?'var(--loss)':'var(--ink)', c2=st.rAvg>0?'var(--win)':st.rAvg<0?'var(--loss)':'var(--ink)';
    capL='累積 R（區間淨值曲線）'; headL=`<span style="color:${c1}">${fnum(st.rTotal,2)}</span>`; unitL='R 淨額';
    capR='期望值 / 筆'; headR=`<span style="color:${c2};font-size:26px">${fnum(st.rAvg,2)}</span>`; unitR='R';
  }
  hero.innerHTML=`<div class="hero-top">
      <div><div class="cap">${capL}</div><div class="netR num">${headL}<small>${unitL}</small></div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px">
        <div class="seg"><button class="${mode==='R'?'on':''}" data-cm="R">R</button><button class="${mode==='amt'?'on':''}" data-cm="amt">金額</button></div>
        <div style="text-align:right"><div class="cap">${capR}</div><div class="netR num">${headR}<small>${unitR}</small></div></div>
      </div>
    </div>${curveSVG(cum,mode)}`;
  hero.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ S.curveMode=b.dataset.cm; route(); });
  root.append(hero);

  // ledger 統計條
  const strip=el('div',{class:'strip'});
  const cells=[
    ['勝率', st.winRate+'%', `${st.wins} 勝 / ${st.losses} 負`],
    ['獲利因子', st.profitFactor==null?'—':st.profitFactor.toFixed(2), '總獲利 R ÷ 總虧損 R'],
    ['計畫遵守率', st.planRate==null?'—':st.planRate+'%', '有紀錄的交易'],
    ['最佳 / 最差 R', `${fnum(st.best,1)} / ${fnum(st.worst,1)}`, '單筆極值'],
  ];
  cells.forEach(([k,v,x])=>{ const cls=k==='勝率'?(st.winRate>=50?'pos':st.winRate>0?'neg':''):'';
    strip.append(el('div',{class:'stat',html:`<div class="k">${k}</div><div class="v ${cls} num">${v}</div><div class="x">${x}</div>`})); });
  root.append(strip);

  // 近期交易
  const p=el('div',{class:'panel'});
  p.append(el('div',{class:'panel-h',html:`<h3>近期交易</h3><span class="sub">最新在上</span>`}));
  const recent=[...rows].reverse().slice(0,8);
  if(!recent.length){ p.append(emptyBlock('尚無交易','到「交易紀錄」記下第一筆，這裡會即時反映。','前往交易紀錄',()=>{S.view='trades';renderNav();route();})); }
  else{ p.append(tradeTable(recent,false)); }
  root.append(p);
}
function curveSVG(cum,mode){
  const W=760,H=132,pad=6;
  const emptyMsg = mode==='amt' ? '在「盤後檢討」填寫兩天以上的每日損益，這裡會畫出金額曲線' : '累積兩筆以上交易後，這裡會畫出你的 R 曲線';
  if(cum.length<2) return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><text x="12" y="70" fill="var(--faint)" font-size="12">${emptyMsg}</text></svg>`;
  const xs=cum.map((_,i)=>pad+i*(W-2*pad)/(cum.length-1));
  const vals=cum.map(c=>c.v), lo=Math.min(0,...vals), hi=Math.max(0,...vals), span=(hi-lo)||1;
  const y=v=>H-pad-(v-lo)/span*(H-2*pad);
  const line=xs.map((x,i)=>`${i?'L':'M'}${x.toFixed(1)},${y(vals[i]).toFixed(1)}`).join(' ');
  const area=`${line} L${xs[xs.length-1].toFixed(1)},${y(0).toFixed(1)} L${xs[0].toFixed(1)},${y(0).toFixed(1)} Z`;
  const end=vals[vals.length-1], stroke=end>0?'var(--win)':end<0?'var(--loss)':'var(--muted)';
  const fill=end>0?'#4fb28622':end<0?'#e06c6c22':'#8b98ab18';
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line class="zero" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>
    <path d="${area}" fill="${fill}"/><path d="${line}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${xs[xs.length-1]}" cy="${y(end)}" r="3.5" fill="${stroke}"/></svg>`;
}

function viewTrades(root){
  const rows=[...S.data.trades].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.created_at||'').localeCompare(String(a.created_at||'')));
  const head=el('div',{class:'head'});
  head.innerHTML=`<div><h2>交易紀錄</h2><p>${rows.length} 筆</p></div>`;
  head.append(el('div',{class:'tools'},[el('button',{class:'btn primary',onclick:()=>tradeForm()},'＋ 新增交易')]));
  root.append(head);
  const p=el('div',{class:'panel'});
  if(!rows.length) p.append(emptyBlock('還沒有交易','記下進場、出場、停損與 R 值，累積你的統計基礎。','新增交易',()=>tradeForm()));
  else p.append(tradeTable(rows,true));
  root.append(p);
}
function tradeTable(rows,actions){
  const wrap=el('div',{class:'tw'}); const t=el('table');
  t.innerHTML=`<thead><tr><th>日期</th><th>商品</th><th>方向</th><th>策略</th>
    <th style="text-align:right">進場</th><th style="text-align:right">停損</th><th style="text-align:right">出場</th>
    <th style="text-align:right">R</th><th>計畫</th>${actions?'<th></th>':''}</tr></thead>`;
  const tb=el('tbody');
  rows.forEach(t0=>{ const R=t0.rMultiple, rc=R>0?'pos':R<0?'neg':'';
    const tr=el('tr');
    tr.innerHTML=`<td class="num">${esc(t0.date)}</td><td style="font-weight:600">${esc(t0.symbol)}</td>
      <td><span class="pill ${t0.direction==='short'?'short':'long'}">${t0.direction==='short'?'做空':'做多'}</span></td>
      <td style="color:var(--muted)">${esc(t0.strategy||'—')}</td>
      <td class="num" style="text-align:right">${t0.entry??'—'}</td>
      <td class="num" style="text-align:right;color:var(--loss)">${t0.stop??'—'}</td>
      <td class="num" style="text-align:right">${t0.exit??'—'}</td>
      <td class="num rcell ${rc}" style="text-align:right;font-weight:600">${fnum(R,2)}</td>
      <td>${t0.planFollowed?'<span style="color:var(--win)">✓</span>':'<span style="color:var(--faint)">✗</span>'}</td>`;
    if(actions){ const td=el('td'); const box=el('div',{class:'rowact'});
      box.append(iconBtn('edit',()=>tradeForm(t0)), iconBtn('del',()=>confirmDel('trades',t0.id,`${t0.symbol} ${t0.date}`)));
      td.append(box); tr.append(td); }
    tb.append(tr); });
  t.append(tb); wrap.append(t); return wrap;
}

async function pullSummary(date){

/* ══════════ 月報表 ══════════ */
function monthlyAgg(){
  const map={}; // key: YYYY-MM
  const bucket=k=>map[k]||(map[k]={month:k, tCount:0,wins:0,losses:0,be:0,rSum:0,rPos:0,rNeg:0,py:0,pt:0,
    pnl:0,pnlDays:0,reviewDays:0,disc:[],emo:[],over:[],fpY:0,fpT:0});
  S.data.trades.forEach(t=>{ const k=String(t.date||'').slice(0,7); if(k.length!==7)return; const m=bucket(k);
    m.tCount++; const R=(t.rMultiple==null||t.rMultiple==='')?null:Number(t.rMultiple);
    if(R!=null&&!isNaN(R)){ m.rSum+=R; if(R>0){m.wins++;m.rPos+=R;} else if(R<0){m.losses++;m.rNeg+=R;} else m.be++; }
    if(t.planFollowed===true||t.planFollowed===false){ m.pt++; if(t.planFollowed===true)m.py++; } });
  S.data.postmarket.forEach(r=>{ const k=String(r.date||'').slice(0,7); if(k.length!==7)return; const m=bucket(k);
    m.reviewDays++;
    if(r.pnl!=null&&!isNaN(r.pnl)&&r.pnl!==''){ m.pnl+=Number(r.pnl); m.pnlDays++; }
    [['disc','disciplineScore'],['emo','emotionScore'],['over','overallScore']].forEach(([f,src])=>{
      const v=r[src]; if(v!=null&&v!==''&&!isNaN(v)) m[f].push(Number(v)); });
    if(r.followedPlan===true||r.followedPlan===false){ m.fpT++; if(r.followedPlan===true)m.fpY++; } });
  const avg=a=>a.length?+(a.reduce((s,x)=>s+x,0)/a.length).toFixed(1):null;
  return Object.values(map).map(m=>{ const dec=m.wins+m.losses; return {
    month:m.month, tCount:m.tCount,
    winRate: dec?+(m.wins/dec*100).toFixed(1):null, wins:m.wins, losses:m.losses,
    rTotal:+m.rSum.toFixed(2), rAvg:m.tCount?+(m.rSum/m.tCount).toFixed(2):null,
    profitFactor:m.rNeg!==0?+(m.rPos/Math.abs(m.rNeg)).toFixed(2):null,
    pnl:m.pnlDays?Math.round(m.pnl):null, pnlDays:m.pnlDays, reviewDays:m.reviewDays,
    disc:avg(m.disc), followRate:m.fpT?+(m.fpY/m.fpT*100).toFixed(0):null,
  }; }).sort((a,b)=>b.month.localeCompare(a.month));
}
function viewMonth(root){
  const rows=monthlyAgg();

  head.innerHTML=`<div><h2>月報表</h2><p>${rows.length?`${rows.length} 個月 · 交易 R 與盤後每日損益的月度彙整`:'尚無可彙整的資料'}</p></div>`;

    <th style="text-align:right">R 合計</th><th style="text-align:right">期望值</th><th style="text-align:right">損益金額</th>
    <th style="text-align:right">複盤天數</th><th style="text-align:right">紀律均分</th><th style="text-align:right">遵守率</th></tr></thead>`;
  const tb=el('tbody');
  rows.forEach(m=>{ const rc=m.rTotal>0?'pos':m.rTotal<0?'neg':'', pc=m.pnl>0?'pos':m.pnl<0?'neg':'';
    const tr=el('tr');
    tr.innerHTML=`<td class="num" style="font-weight:600">${m.month}</td>
      <td class="num" style="text-align:right">${m.tCount||'—'}</td>
      <td class="num" style="text-align:right">${m.winRate==null?'—':m.winRate+'%'}</td>
      <td class="num rcell ${rc}" style="text-align:right;font-weight:600">${fnum(m.rTotal,2)}</td>
      <td class="num" style="text-align:right;color:var(--muted)">${m.rAvg==null?'—':fnum(m.rAvg,2)}</td>
      <td class="num ${pc?'rcell '+pc:''}" style="text-align:right;font-weight:600">${m.pnl==null?'—':fmoney(m.pnl)}</td>
      <td class="num" style="text-align:right;color:var(--muted)">${m.reviewDays||'—'}</td>
      <td class="num" style="text-align:right">${m.disc==null?'—':m.disc}</td>
      <td class="num" style="text-align:right;color:var(--muted)">${m.followRate==null?'—':m.followRate+'%'}</td>`;
    tb.append(tr); });
  // 合計列
  const tot=rows.reduce((a,m)=>{ a.t+=m.tCount; a.r+=m.rTotal; if(m.pnl!=null){a.p+=m.pnl;a.ph=true;} a.rev+=m.reviewDays; return a; },{t:0,r:0,p:0,ph:false,rev:0});
  const trf=el('tr',{style:'border-top:2px solid var(--line-solid)'});
  const totRc=tot.r>0?'pos':tot.r<0?'neg':'', totPc=tot.p>0?'pos':tot.p<0?'neg':'';
  trf.innerHTML=`<td style="font-weight:700;color:var(--gold)">合計</td>
    <td class="num" style="text-align:right;font-weight:600">${tot.t}</td><td></td>
    <td class="num rcell ${totRc}" style="text-align:right;font-weight:700">${fnum(+tot.r.toFixed(2),2)}</td><td></td>
    <td class="num ${tot.ph?'rcell '+totPc:''}" style="text-align:right;font-weight:700">${tot.ph?fmoney(tot.p):'—'}</td>
    <td class="num" style="text-align:right;font-weight:600">${tot.rev}</td><td></td><td></td>`;
  tb.append(trf);
  t.append(tb); wrap.append(t); p.append(wrap); root.append(p);
}
function monthBars(rows,mode){
  const asc=[...rows].reverse();
  const val=m=> mode==='amt' ? (m.pnl==null?0:m.pnl) : m.rTotal;
  const has=asc.some(m=>val(m)!==0);
  if(!has) return el('div',{class:'empty',style:'padding:26px'},[el('p',{},mode==='amt'?'尚未有盤後每日損益可畫圖':'尚未有 R 資料可畫圖')]);
  const W=760,H=150,pad=6,gap=6, n=asc.length, bw=Math.min(64,(W-2*pad)/n-gap);
  const vals=asc.map(val), hi=Math.max(0,...vals), lo=Math.min(0,...vals), span=(hi-lo)||1;
  const y=v=>H-pad-(v-lo)/span*(H-2*pad);
  const zero=y(0);
  let bars='', labels='';
  asc.forEach((m,i)=>{ const cx=pad+i*((W-2*pad)/n)+((W-2*pad)/n-bw)/2, v=val(m), yy=y(v);
    const top=Math.min(yy,zero), h=Math.abs(yy-zero), col=v>0?'var(--win)':v<0?'var(--loss)':'var(--faint)';
    bars+=`<rect x="${cx.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="3" fill="${col}"><title>${m.month}: ${mode==='amt'?fmoney(v):fnum(v,2)+' R'}</title></rect>`;
    labels+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H+13}" fill="var(--faint)" font-size="10" text-anchor="middle">${m.month.slice(2)}</text>`; });
  return el('div',{html:`<svg viewBox="0 0 ${W} ${H+20}" style="width:100%;height:${H+20}px;display:block;overflow:visible">
    <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line-solid)"/>${bars}${labels}</svg>`});
}

function numOrNull(sel){ const v=$(sel).value.trim(); return v===''?null:Number(v); }
function setVal(sel,v){ const n=$(sel); if(n)n.value=v; }
function reset(root){ root.innerHTML=''; return root; }

function scoreField(id,label,cur){ const wrap=el('div',{class:'field'});
  wrap.append(el('label',{class:'fl'},label));
  const s=el('div',{class:'score',id}); s.dataset.val=cur??'';
  for(let i=1;i<=5;i++){ const sp=el('span',{class:Number(cur)===i?'on':'',onclick:()=>{
    s.dataset.val=String(i); [...s.children].forEach((c,ix)=>c.className=ix<i?'on':''); }},String(i)); s.append(sp); }
  // 點亮到 i：用 on 標記 1..i
  s.querySelectorAll('span').forEach((sp,ix)=>{ sp.onclick=()=>{ const v=ix+1; s.dataset.val=String(v);
    s.querySelectorAll('span').forEach((c,j)=>c.className=j<v?'on':''); }; });
  if(cur){ s.querySelectorAll('span').forEach((c,j)=>c.className=j<Number(cur)?'on':''); }
  wrap.append(s); return wrap; }

/* watchlist 標籤輸入（物件陣列 {symbol,setupType}） */
function watchlistInput(id,list){
  const box=el('div',{class:'tags',id}); box._items=(list||[]).map(x=> typeof x==='string'?{symbol:x,setupType:''}:x);
  const inp=el('input',{class:'tin',placeholder:'輸入代號後按 Enter'});
  const render=()=>{ [...box.querySelectorAll('.tag')].forEach(n=>n.remove());
    box._items.forEach((it,i)=>{ const tag=el('div',{class:'tag'});
      tag.innerHTML=`<span>${esc(it.symbol)}</span>${it.setupType?`<span class="st">${esc(it.setupType)}</span>`:''}`;
      tag.append(el('button',{onclick:()=>{ box._items.splice(i,1); render(); },title:'移除'},'✕'));
      box.insertBefore(tag,inp); }); };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=inp.value.trim().toUpperCase();
    if(v){ box._items.push({symbol:v,setupType:''}); inp.value=''; render(); } }
    else if(e.key==='Backspace'&&!inp.value&&box._items.length){ box._items.pop(); render(); } });
  box.append(inp); render(); return box; }
function readWatchlist(id){ return ($('#'+id)._items)||[]; }

/* ══════════ 存 / 刪 ══════════ */
async function save(kind,rec,close,okMsg){
  try{ await GS.upsert(kind,rec);
    const list=S.data[kind]; const key=kind==='premarket'||kind==='postmarket'?'date':'id';
    const i=list.findIndex(x=>String(x[key])===String(rec[key]));
    const merged={...(i>=0?list[i]:{}),...rec,updated_at:new Date().toISOString()};
    if(i>=0)list[i]=merged; else list.push(merged);
    toast(okMsg||'已儲存','ok'); if(close)close(); route();
  }catch(e){ toast('儲存失敗：'+e.message,'err'); } }
function confirmDel(kind,id,label){
  const b=el('div',{style:'color:var(--muted);font-size:14px'},`確定刪除「${label}」？此動作無法復原。`);
  openModal('刪除確認',b,async close=>{
    try{ await GS.remove(kind,id); const key=kind==='premarket'||kind==='postmarket'?'date':'id';
      S.data[kind]=S.data[kind].filter(x=>String(x[key])!==String(id)); toast('已刪除','ok'); close(); route();
    }catch(e){ toast('刪除失敗：'+e.message,'err'); } },'', '刪除', 'danger'); }

/* ══════════ Modal ══════════ */
function openModal(title,bodyNode,onSave,cls='',saveLabel='儲存',saveKind='primary'){
  const m=$('#modal'); m.className='modal'+(cls?' '+cls:'');
  m.innerHTML=''; m.append(el('div',{class:'modal-h'},[el('h3',{},title),
    el('button',{class:'iconbtn',onclick:closeModal,html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'})]));
  m.append(el('div',{class:'modal-b'},[bodyNode]));
  const savedBtn=el('button',{class:'btn '+saveKind,onclick:()=>onSave(closeModal)},saveLabel);
  m.append(el('div',{class:'modal-f'},[el('button',{class:'btn ghost',onclick:closeModal},'取消'), savedBtn]));
  $('#scrim').classList.add('open');
}
function closeModal(){ $('#scrim').classList.remove('open'); }
$('#scrim').addEventListener('click',e=>{ if(e.target===$('#scrim'))closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
