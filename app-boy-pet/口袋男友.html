<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>口袋男友</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen handheld — room window on top, affection meter, four stat gauges, a 2x3 action pad below */
:root{
  --bg:#f6ece6; --shell:#fffdfb; --ink:#3a2a2e; --muted:#8a7378;
  --accent:#ff8fa3; --accent-ink:#4a1020;
  --line:#ecdcd6; --good:#5bbf8a; --warn:#f0a020; --bad:#e2554f; --love:#ff6b8a;
  --display:"Zen Maru Gothic","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1619; --shell:#2a2125; --ink:#f6eaee; --muted:#bba5ac;
  --accent:#ff9fb1; --accent-ink:#3a0c18; --line:#3f3237; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1619; --shell:#2a2125; --ink:#f6eaee; --muted:#bba5ac;
  --accent:#ff9fb1; --accent-ink:#3a0c18; --line:#3f3237; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:900;font-size:1.6rem;margin:0;letter-spacing:.02em}
#name{background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer;border-bottom:2px dashed var(--line)}
#name:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.meta{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:28px;overflow:hidden;background:var(--shell);border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(90,30,50,.5)}
canvas{display:block;width:100%;aspect-ratio:4/3;cursor:pointer}
.bubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--shell);color:var(--ink);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:.88rem;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.chips{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.chip{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bad);color:#fff}
.chip.sleep{background:#5b63c9}.chip.mad{background:#e07a2e}
.love{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:.85rem}
.love b{font-weight:700;color:var(--love)}
.love .bar{height:12px}
.love .bar i{background:linear-gradient(90deg,#ffb3c1,var(--love))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.stat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:.85rem}
.stat b{font-weight:500;color:var(--muted);letter-spacing:.05em}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .4s,background .4s}
.stat span,.love span{font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;font-size:.8rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button,.game button,.confirm button{font-family:var(--display);font-weight:700;font-size:1rem;border:1px solid var(--line);background:var(--shell);color:var(--ink);border-radius:18px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s,background .2s}
.pad button small{font-family:var(--body);font-weight:400;font-size:.7rem;color:var(--muted)}
.pad button:active{transform:scale(.96)}
.pad button:focus-visible,.game button:focus-visible,.confirm button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pad .hot{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pad .hot small{color:var(--accent-ink);opacity:.75}
.game,.confirm{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--shell);border:1px solid var(--line);border-radius:18px;padding:12px}
.game p,.confirm p{margin:0;width:100%;text-align:center;font-size:.9rem}
.game button,.confirm button{flex:1;min-width:100px;flex-direction:row;justify-content:center}
.log{font-size:.8rem;color:var(--muted);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;max-height:5.2em;overflow:hidden}
footer{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div class="app">
  <header>
    <h1><button id="name" title="點一下改名字">阿哲</button></h1>
    <div class="meta"><div id="stageLbl">剛認識</div><div id="age">0 分鐘</div></div>
  </header>

  <div class="stage">
    <canvas id="cv" width="800" height="600" aria-label="男友的房間，點一下可以摸摸頭"></canvas>
    <div class="bubble" id="bubble">嗨，我來了！</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="love"><b>♥ 好感</b><div class="bar"><i id="b-love"></i></div><span id="v-love"></span></div>

  <div class="stats">
    <div class="stat"><b>飽足</b><div class="bar"><i id="b-hunger"></i></div><span id="v-hunger"></span></div>
    <div class="stat"><b>心情</b><div class="bar"><i id="b-happy"></i></div><span id="v-happy"></span></div>
    <div class="stat"><b>精力</b><div class="bar"><i id="b-energy"></i></div><span id="v-energy"></span></div>
    <div class="stat"><b>整潔</b><div class="bar"><i id="b-clean"></i></div><span id="v-clean"></span></div>
  </div>

  <div class="game" id="game" hidden>
    <p id="gameMsg">他會往哪邊看？猜猜看！</p>
    <button id="gL">← 左邊</button><button id="gR">右邊 →</button>
  </div>
  <div class="confirm" id="confirm" hidden>
    <p>確定要重新開始？目前的回憶會消失。</p>
    <button id="cYes">重新開始</button><button id="cNo">取消</button>
  </div>

  <div class="pad" id="pad">
    <button data-a="meal">做飯給他<small>飽足 +35</small></button>
    <button data-a="snack">送奶茶<small>心情 +12</small></button>
    <button data-a="play">一起玩<small>猜左右</small></button>
    <button data-a="bath">一起打掃<small>收拾房間</small></button>
    <button data-a="sleep" id="sleepBtn">哄他睡覺<small>恢復精力</small></button>
    <button data-a="doctor" id="docBtn">照顧他<small>治療感冒</small></button>
  </div>

  <ul class="log" id="log"></ul>
  <footer><span>關掉頁面後他還是會想你</span><button id="reset">重新開始</button></footer>
</div>

<script>
(function(){
const KEY='pocket-bf-v1';
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
const now=()=>Date.now();
const clamp=v=>Math.max(0,Math.min(100,v));

function fresh(){return{name:'阿哲',born:now(),last:now(),hunger:80,happy:80,energy:90,clean:100,mess:0,love:5,sleeping:false,sick:false,lowTime:0,log:[]};}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||typeof S.born!=='number'){S=fresh();note('第一次見面，他有點害羞');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// Per-minute rates
function step(min){
  const a=S.sleeping;
  S.hunger=clamp(S.hunger-min*(a?0.18:0.45));
  S.happy=clamp(S.happy-min*(a?0.1:0.32)-(S.mess*0.08*min)-(S.sick?0.2*min:0));
  S.clean=clamp(S.clean-min*(0.22+S.mess*0.15));
  S.energy=clamp(S.energy+min*(a?1.6:-0.3));
  if(a&&S.energy>=100){S.sleeping=false;note('睡飽了，說早安～');}
  if(!a&&Math.random()<min/28&&S.mess<4){S.mess++;}
  const low=S.hunger<15||S.clean<15||S.mess>=3||S.happy<15;
  S.lowTime=low?S.lowTime+min:Math.max(0,S.lowTime-min);
  if(low)S.love=Math.max(0,S.love-min*0.05);
  if(!S.sick&&S.lowTime>20){S.sick=true;note(S.name+'感冒了，快去照顧他');}
}
// Catch up on time away (max 48h)
(function(){let m=Math.min((now()-S.last)/60000,2880);
  while(m>0){const d=Math.min(m,5);step(d);m-=d;}
  if((now()-S.last)>10*60000)note('你離開了 '+fmtAge(now()-S.last)+'，他一直在等你');
  S.last=now();})();

function fmtAge(ms){const m=Math.floor(ms/60000);if(m<60)return m+' 分鐘';const h=Math.floor(m/60);if(h<24)return h+' 小時 '+(m%60)+' 分';return Math.floor(h/24)+' 天 '+(h%24)+' 小時';}
const STAGES=[[0,'剛認識'],[20,'曖昧中'],[60,'交往中'],[150,'熱戀期'],[300,'老夫老妻']];
function stage(){let r=STAGES[0];for(const s of STAGES)if(S.love>=s[0])r=s;return r;}
function nextStage(){for(const s of STAGES)if(S.love<s[0])return s;return null;}
function addLove(v){const before=stage()[1];S.love=Math.max(0,S.love+v);const after=stage()[1];if(after!==before&&v>0){note('關係升級：'+after+'！');say('我們現在是'+after+'了耶 ♥');burst('♥',12);}}

let bubbleT=0;
function say(t){$('bubble').textContent=t;$('bubble').style.opacity=1;bubbleT=now()+3500;}
function note(t){const d=new Date();S.log.unshift(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'  '+t);S.log=S.log.slice(0,8);}

// Particles
let parts=[];
function burst(ch,n=8){for(let i=0;i<n;i++)parts.push({x:440+(Math.random()-.5)*180,y:330+(Math.random()-.5)*100,vx:(Math.random()-.5)*3,vy:-1-Math.random()*2.5,life:60+Math.random()*30,ch});}

let anim={jump:0,look:0,shy:0,act:null,actT:0};
// 動作圖：吃飯 / 喝奶茶 / 打掃，播完接害羞
function doAction(k,frames){anim.act=k;anim.actT=frames;anim.shy=0;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function act(a){
  if(S.sleeping&&a!=='sleep'){say('噓……他睡著了');return;}
  switch(a){
    case 'meal': if(S.hunger>95){say('好飽……吃不下了啦');S.happy=clamp(S.happy-3);break;}
      S.hunger=clamp(S.hunger+35);doAction('eat',180);burst('🍳',5);addLove(3);say(pick(['你做的最好吃了！','嗯～好香，謝謝你','可以每天都吃你煮的嗎？']));note('做了一頓飯給他');break;
    case 'snack': S.happy=clamp(S.happy+12);S.hunger=clamp(S.hunger+6);doAction('drink',150);burst('♥',6);addLove(2);say(pick(['半糖少冰，你記得耶','奶茶！最懂我的還是你','喝一口給你～']));note('送了一杯奶茶');break;
    case 'play': if(S.energy<15){say('好累……想睡覺');break;} openGame();return;
    case 'bath': {S.clean=100;const p=S.mess;S.mess=0;doAction('clean',180);burst('✦',14);addLove(p?2:1);say(p?'收掉 '+p+' 堆東西，房間乾淨了！':'一起打掃好像也很浪漫');note('一起打掃房間');break;}
    case 'sleep': S.sleeping=!S.sleeping;say(S.sleeping?'晚安……夢裡見':'嗯……再睡五分鐘嘛');note(S.sleeping?'哄他去睡覺':'把他叫醒了');if(!S.sleeping)S.happy=clamp(S.happy-(S.energy<60?8:0));break;
    case 'doctor': if(!S.sick){say('我很好啦，別擔心');break;} S.sick=false;S.lowTime=0;S.happy=clamp(S.happy-5);addLove(5);burst('✚',6);say('有你照顧，馬上就好了');note('照顧感冒的他，退燒了');break;
  }
  save();render();
}
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));

// Guess game
let gameRound=0,gameWins=0;
function openGame(){gameRound=0;gameWins=0;$('game').hidden=false;$('pad').hidden=true;$('gameMsg').textContent='第 1 / 3 回合：他會往哪邊看？';}
function guess(dir){
  const p=Math.random()<.5?-1:1;anim.look=p*40;
  const win=p===dir;gameRound++;if(win){gameWins++;anim.jump=30;}
  if(gameRound<3){$('gameMsg').textContent=(win?'猜中了！':'沒猜中～')+' 第 '+(gameRound+1)+' / 3 回合';}
  else{
    S.happy=clamp(S.happy+8+gameWins*7);S.energy=clamp(S.energy-12);S.hunger=clamp(S.hunger-6);addLove(1+gameWins);
    note('一起玩猜左右，贏了 '+gameWins+' 次');say(gameWins>=2?'你怎麼這麼懂我？':'哈哈，下次讓你贏');
    anim.shy=90;burst('★',gameWins*3+2);save();
    setTimeout(()=>{$('game').hidden=true;$('pad').hidden=false;render();},700);
    $('gameMsg').textContent='結果：3 回合猜中 '+gameWins+' 次';
  }
}
$('gL').onclick=()=>guess(-1);$('gR').onclick=()=>guess(1);

// Pet & rename & reset
let lastPat=0;
cv.addEventListener('click',()=>{if(S.sleeping){say('Zzz……（嘴角在笑）');return;}
  S.happy=clamp(S.happy+2);if(now()-lastPat>20000){addLove(1);lastPat=now();}
  anim.shy=80;anim.jump=20;burst('♥',3);say(pick(['幹嘛啦……','再摸一下嘛','你今天也很可愛','被你摸頭好安心']));save();render();});
function bindName(){$('name').onclick=()=>{const inp=document.createElement('input');inp.value=S.name;inp.maxLength=8;inp.style.cssText='font:inherit;width:6em;background:var(--shell);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 6px';
  $('name').replaceWith(inp);inp.focus();inp.select();let done=false;
  const fin=()=>{if(done)return;done=true;const v=inp.value.trim();if(v)S.name=v;save();const b=document.createElement('button');b.id='name';b.title='點一下改名字';b.textContent=S.name;inp.replaceWith(b);bindName();render();};
  inp.onblur=fin;inp.onkeydown=e=>{if(e.key==='Enter')fin();};};}
bindName();
$('reset').onclick=()=>{$('confirm').hidden=false;$('pad').hidden=true;};
$('cNo').onclick=()=>{$('confirm').hidden=true;$('pad').hidden=false;};
$('cYes').onclick=()=>{S=fresh();note('第一次見面，他有點害羞');save();$('confirm').hidden=true;$('pad').hidden=false;say('嗨，初次見面！');render();};

function color(v){return v<25?'var(--bad)':v<50?'var(--warn)':'var(--good)';}
function render(){
  $('name').textContent=S.name;
  const [,lbl]=stage();$('stageLbl').textContent=lbl;
  $('age').textContent='在一起 '+fmtAge(now()-S.born);
  const nx=nextStage(),cur=stage()[0];const pct=nx?(S.love-cur)/(nx[0]-cur)*100:100;
  $('b-love').style.width=Math.max(2,pct)+'%';$('v-love').textContent=Math.floor(S.love);
  for(const k of['hunger','happy','energy','clean']){const v=Math.round(S[k]);$('b-'+k).style.width=v+'%';$('b-'+k).style.background=color(v);$('v-'+k).textContent=v;}
  $('chips').innerHTML=(S.sick?'<span class="chip">感冒</span>':'')+(S.sleeping?'<span class="chip sleep">睡覺中</span>':'')+(isMad()&&!S.sick&&!S.sleeping?'<span class="chip mad">生氣中</span>':'');
  $('sleepBtn').firstChild.textContent=S.sleeping?'叫他起床':'哄他睡覺';
  $('docBtn').classList.toggle('hot',S.sick);
  $('pad').querySelector('[data-a=meal]').classList.toggle('hot',S.hunger<30&&!S.sick);
  $('pad').querySelector('[data-a=bath]').classList.toggle('hot',S.mess>=2||S.clean<30);
  $('log').innerHTML=S.log.map(l=>'<li>'+l.replace(/</g,'&lt;')+'</li>').join('');
}
function isMad(){return S.clean<25||S.mess>=3;}

// ---------- Room drawing ----------
let t=0;
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function drawRoom(night){
  const W=800,H=600,FY=410;
  // wall
  let g=cx.createLinearGradient(0,0,0,FY);
  g.addColorStop(0,night?'#4a3d52':'#fbe9df');g.addColorStop(1,night?'#5e4b5e':'#f5d9cc');
  cx.fillStyle=g;cx.fillRect(0,0,W,FY);
  // wallpaper dots
  cx.fillStyle=night?'rgba(255,255,255,.05)':'rgba(220,150,140,.18)';
  for(let y=24;y<FY-20;y+=46)for(let x=(y/46%2)*30+16;x<W;x+=60){cx.beginPath();cx.arc(x,y,3,0,7);cx.fill();}
  // floor
  g=cx.createLinearGradient(0,FY,0,H);g.addColorStop(0,night?'#6b4a38':'#d9a77a');g.addColorStop(1,night?'#4f3628':'#c08a5c');
  cx.fillStyle=g;cx.fillRect(0,FY,W,H-FY);
  cx.strokeStyle=night?'rgba(0,0,0,.18)':'rgba(120,70,30,.18)';cx.lineWidth=2;
  for(let y=FY+26;y<H;y+=30){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
  for(let r=0,y=FY;y<H;r++,y+=30)for(let x=(r%2)*90;x<W;x+=180){cx.beginPath();cx.moveTo(x,y);cx.lineTo(x,y+30);cx.stroke();}
  // baseboard
  cx.fillStyle=night?'#3b2f3a':'#fff6f0';cx.fillRect(0,FY-12,W,14);

  // window
  const wx=520,wy=56,ww=210,wh=190;
  g=cx.createLinearGradient(0,wy,0,wy+wh);
  g.addColorStop(0,night?'#141838':'#9cc8ff');g.addColorStop(1,night?'#2e2f63':'#e3f0ff');
  cx.fillStyle=g;cx.fillRect(wx,wy,ww,wh);
  cx.save();cx.beginPath();cx.rect(wx,wy,ww,wh);cx.clip();
  if(night){cx.fillStyle='#fff6d0';cx.beginPath();cx.arc(wx+150,wy+52,24,0,7);cx.fill();cx.fillStyle='#141838';cx.beginPath();cx.arc(wx+162,wy+44,21,0,7);cx.fill();
    cx.fillStyle='#fff';for(let i=0;i<10;i++){cx.globalAlpha=.4+.4*Math.sin(t/30+i);cx.fillRect(wx+(i*53)%ww,wy+(i*37)%(wh-60)+8,3,3);}cx.globalAlpha=1;
    // city lights
    cx.fillStyle='#232349';cx.fillRect(wx,wy+wh-50,ww,50);cx.fillStyle='#ffd56b';for(let i=0;i<14;i++)cx.fillRect(wx+8+(i*29)%(ww-14),wy+wh-40+(i*7)%30,6,6);}
  else{cx.fillStyle='#ffd45c';cx.beginPath();cx.arc(wx+160,wy+50,26,0,7);cx.fill();
    cx.fillStyle='rgba(255,255,255,.9)';const c=(t*.25)%(ww+140)-70;[[0,0,22],[26,-8,20],[50,2,18]].forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(wx+c+dx,wy+90+dy,r,0,7);cx.fill();});
    cx.fillStyle='#b9d7c2';cx.fillRect(wx,wy+wh-40,ww,40);}
  cx.restore();
  cx.strokeStyle=night?'#2c2430':'#ffffff';cx.lineWidth=10;cx.strokeRect(wx,wy,ww,wh);
  cx.lineWidth=6;cx.beginPath();cx.moveTo(wx+ww/2,wy);cx.lineTo(wx+ww/2,wy+wh);cx.moveTo(wx,wy+wh/2);cx.lineTo(wx+ww,wy+wh/2);cx.stroke();
  // curtains
  cx.fillStyle=night?'#7a4d63':'#ffb6c4';
  [[wx-34,1],[wx+ww+34,-1]].forEach(([x,d])=>{cx.beginPath();cx.moveTo(x,wy-24);cx.lineTo(x+d*48,wy-24);cx.quadraticCurveTo(x+d*20,wy+wh/2,x+d*40,wy+wh+30);cx.lineTo(x,wy+wh+30);cx.closePath();cx.fill();});
  cx.fillStyle=night?'#2c2430':'#c9a07a';cx.fillRect(wx-50,wy-30,ww+100,8);

  // framed photo with heart
  cx.fillStyle=night?'#2c2430':'#fff';rr(330,90,110,86,6);cx.fill();
  cx.fillStyle=night?'#5a3c4c':'#ffe1e7';cx.fillRect(340,100,90,66);

};
for(const k in SRC){const im=new Image();im.src=SRC[k];IMG[k]=im;}

function moodKey(){
  if(S.sick)return'sick';
  if(anim.act)return anim.act;
  if(anim.shy>0||anim.jump>0)return'shy';
  if(isMad())return'angry';
  if(S.hunger<20)return'cry';
  if(S.happy<30)return'sit';
  return'ok';
}
let lastGripe=0;
function drawBF(){
  if(S.sleeping)return;
  if(anim.jump>0)anim.jump--;if(anim.actT>0&&--anim.actT===0){anim.act=null;anim.shy=90;}if(anim.shy>0)anim.shy--;anim.look*=.96;
  let key=moodKey();
  const ph=t/160,walking=key==='ok'&&Math.abs(Math.cos(ph))>.35;
  if(key==='ok')key=walking?'walk':'idle';
  const roam=(key==='walk'||key==='idle')?Math.sin(ph)*150:0;
  const facing=Math.cos(ph)>=0?1:-1;
  const im=IMG[key];if(!im||!im.complete||!im.naturalWidth)return;
  const hMap={idle:400,walk:395,shy:395,angry:400,cry:395,sit:300,sick:330,eat:290,drink:400,clean:385};
  const h=hMap[key],w=im.naturalWidth/im.naturalHeight*h;
  let dy=0,rot=0,dx=0;
  if(key==='walk'){dy=-Math.abs(Math.sin(t/9))*5;}
  if(key==='shy'){rot=Math.sin(t/14)*.03;}
  if(key==='eat'){dy=-Math.abs(Math.sin(t/10))*4;}
  if(key==='drink'){rot=Math.sin(t/25)*.02;}
  if(key==='clean'){dx=Math.sin(t/8)*14;rot=Math.sin(t/8)*.03;}
  if(key==='angry'){dx=Math.sin(t*1.3)*1.5;}
  if(key==='sick'){dx=Math.sin(t/25)*2;}
  if(key==='cry'||key==='sit'){rot=Math.sin(t/30)*.015;}
  if(anim.jump)dy-=Math.sin(anim.jump/30*Math.PI)*30;
  const x=450+roam+anim.look+dx,base=575;
  cx.fillStyle='rgba(60,20,20,.18)';cx.beginPath();cx.ellipse(x,base-4,w*.32,14,0,0,7);cx.fill();
  cx.save();cx.translate(x,base+dy);cx.rotate(rot);if(key==='walk'&&facing>0)cx.scale(-1,1);
  cx.drawImage(im,-w/2,-h,w,h);cx.restore();
  if(now()-lastGripe>45000&&now()>bubbleT){
    const lines={angry:['房間好亂……你都不理我','哼，我生氣了'],cry:['肚子好餓……','你什麼時候煮飯給我吃？'],sit:['好無聊……陪我一下嘛','你是不是不喜歡我了'],sick:['頭好暈……','咳咳……好想你在旁邊']}[key];
    if(lines){say(pick(lines));lastGripe=now();}
  }
}

function draw(){
  t++;const hr=new Date().getHours();const night=hr<6||hr>=19||S.sleeping;
  drawRoom(night);drawMess();drawBF();
  parts=parts.filter(p=>p.life-->0);cx.textAlign='center';cx.textBaseline='alphabetic';cx.font='bold 34px sans-serif';
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.ch==='♥'?'#ff6b8a':p.ch==='★'?'#ffb21f':p.ch==='✦'?'#7fc6ff':p.ch==='✚'?'#e2554f':'#fff';cx.fillText(p.ch,p.x,p.y);});cx.globalAlpha=1;
  if(S.sleeping){cx.fillStyle='rgba(10,10,40,.35)';cx.fillRect(0,0,800,600);}
  if(bubbleT&&now()>bubbleT){$('bubble').style.opacity=0;bubbleT=0;}
  requestAnimationFrame(draw);
}

setInterval(()=>{const m=(now()-S.last)/60000;step(m);S.last=now();save();render();},1000);
say(now()-S.born>60000?S.name+'：你回來啦！':'嗨，初次見面，我是'+S.name);
save();render();draw();
})();
