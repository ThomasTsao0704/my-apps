<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps — 小工具集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f4;
    --panel:#ffffff;
    --ink:#16181d;
    --muted:#5a6270;
    --line:#d7dbe3;
    --accent:#2f4bff;
    --accent-soft:#e6e9ff;
    --code:#3a4150;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}

  /* ---- header ---- */
  header{padding:64px 0 32px}
  .mark{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;font-size:15px;letter-spacing:-.01em;
    display:inline-flex;align-items:center;gap:9px;color:var(--ink);
  }
  .mark .dot{width:13px;height:13px;border-radius:4px;background:var(--accent);display:inline-block}
  h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(34px,6vw,52px);
    font-weight:600;letter-spacing:-.03em;line-height:1.05;
    margin:22px 0 12px;max-width:16ch;
  }
  .lede{font-size:17px;color:var(--muted);max-width:52ch}
  .meta{margin-top:18px;font-size:13.5px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:600}

  /* ---- controls ---- */
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:34px 0 8px}
  .search{position:relative;flex:1 1 260px;min-width:220px}
  .search input{
    width:100%;padding:12px 14px 12px 40px;font-size:15px;font-family:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    transition:border-color .15s,box-shadow .15s;
  }
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{
    font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    font-family:inherit;transition:all .12s;
  }
  .tag:hover{border-color:var(--accent)}
  .tag.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* ---- grid ---- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));
    gap:18px;padding:26px 0 80px;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;display:flex;flex-direction:column;
    text-decoration:none;color:inherit;
    transition:transform .14s ease,border-color .14s,box-shadow .14s;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 30px -14px rgba(47,75,255,.35)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:11px;flex-shrink:0;
    display:grid;place-items:center;font-size:22px;background:var(--accent-soft);
  }
  .card h2{font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .card p{font-size:14.5px;color:var(--muted);flex:1;margin-bottom:16px}
  .card .path{
    font-family:"Space Grotesk",ui-monospace,monospace;
    font-size:12.5px;color:var(--code);margin-bottom:14px;
    background:#f4f5f8;padding:5px 9px;border-radius:7px;align-self:flex-start;
  }
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;color:var(--muted);background:#f0f1f5;padding:3px 9px;border-radius:6px}
  .go{font-size:14px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
  .card:hover .go .arr{transform:translateX(3px)}
  .arr{display:inline-block;transition:transform .14s}

  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}

  footer{border-top:1px solid var(--line);padding:28px 0;font-size:13px;color:var(--muted)}
  footer a{color:var(--ink)}

  @media (max-width:560px){
    header{padding:44px 0 24px}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark"><span class="dot"></span>MY&nbsp;APPS</span>
    <h1>我做的小工具,都放在這。</h1>
    <p class="lede">一個收藏各種網頁小工具的地方。點任何一張卡片就能直接開啟使用,每個工具都附有說明。</p>
    <p class="meta"><b id="count">0</b> 個工具</p>

    <div class="controls">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋工具…" autocomplete="off">
      </div>
      <div class="tags" id="tagbar"></div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    以 GitHub Pages 部署 · 想加新工具?打開 <code>index.html</code> 編輯下方的清單即可。
  </footer>
</div>

<!-- ================================================================
     這裡是「唯一的資料來源」。要新增一個 app,只要:
       1. 建立一個資料夾(例如 app-my-tool/),裡面放 index.html
       2. 在下面的陣列複製一個 { } 區塊、改成你的資料
     欄位說明:
       slug  → 資料夾名稱(也是網址路徑),請和資料夾一致
       name  → 顯示名稱
       desc  → 一句話介紹
       icon  → 一個 emoji 當圖示
       tags  → 分類標籤(給搜尋和過濾用)
     ================================================================ -->
<script type="application/json" id="app-registry">
[
  {
    "slug": "app-color-picker",
    "name": "色彩挑選器",
    "desc": "挑一個顏色,馬上拿到 HEX / RGB / HSL 三種格式,一鍵複製。",
    "icon": "🎨",
    "tags": ["設計", "工具"]
  },
  {
    "slug": "app-word-counter",
    "name": "字數計算器",
    "desc": "貼上文字,即時算出字數、字元數、行數與預估閱讀時間。",
    "icon": "📝",
    "tags": ["文字", "工具"]
  },
    {
    "slug": "app-notion-note",
    "name": "記事本",
    "desc": "挑一個顏色,馬上拿到 HEX / RGB / HSL 三種格式,一鍵複製。",
    "icon": "🎨",
    "tags": ["設計", "工具"]
  },
  {
    "slug": "app-stocks-review",
    "name": "股票紀錄/復盤",
    "desc": "貼上文字,即時算出字數、字元數、行數與預估閱讀時間。",
    "icon": "📝",
    "tags": ["文字", "工具"]
  }
]
</script>

<script>
  const APPS = JSON.parse(document.getElementById('app-registry').textContent);
  const grid = document.getElementById('grid');
  const tagbar = document.getElementById('tagbar');
  const qbox = document.getElementById('q');
  document.getElementById('count').textContent = APPS.length;

  let activeTag = null;
  const allTags = [...new Set(APPS.flatMap(a => a.tags || []))];

  function renderTags(){
    tagbar.innerHTML = '';
    allTags.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tag' + (activeTag === t ? ' on' : '');
      b.textContent = t;
      b.onclick = () => { activeTag = (activeTag === t ? null : t); renderTags(); render(); };
      tagbar.appendChild(b);
    });
  }

  function render(){
    const q = qbox.value.trim().toLowerCase();
    const list = APPS.filter(a => {
      const matchTag = !activeTag || (a.tags || []).includes(activeTag);
      const hay = (a.name + ' ' + a.desc + ' ' + (a.tags||[]).join(' ')).toLowerCase();
      const matchQ = !q || hay.includes(q);
      return matchTag && matchQ;
    });

    grid.innerHTML = '';
    if(!list.length){
      grid.innerHTML = '<div class="empty">沒有符合的工具。試試別的關鍵字?</div>';
      return;
    }
    list.forEach(a => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = a.slug + '/';
      card.innerHTML = `
        <div class="top">
          <div class="ico">${a.icon || '📦'}</div>
          <h2>${a.name}</h2>
        </div>
        <p>${a.desc}</p>
        <span class="path">/${a.slug}/</span>
        <div class="foot">
          <div class="chips">${(a.tags||[]).map(t=>`<span class="chip">${t}</span>`).join('')}</div>
          <span class="go">開啟<span class="arr">→</span></span>
        </div>`;
      grid.appendChild(card);
    });
  }

  qbox.addEventListener('input', render);
  renderTags();
  render();
</script>
</body>
</html>
