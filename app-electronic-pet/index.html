<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>糰子口袋寵物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen handheld — sky window on top, four stat gauges, a 2x3 action pad below */
:root{
  --bg:#e9ecf7; --shell:#fdfdff; --ink:#24264a; --muted:#6b6f96;
  --sky1:#bcd3ff; --sky2:#f3f6ff; --ground:#cfe8c4;
  --accent:#ffb21f; --accent-ink:#4a3100;
  --line:#d8dcef; --good:#3fb47d; --warn:#f0a020; --bad:#e2554f;
  --display:"Zen Maru Gothic","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14152a; --shell:#1f2140; --ink:#eceeff; --muted:#a2a6cf;
  --sky1:#2b3570; --sky2:#3e4a8c; --ground:#2f4a3a;
  --accent:#ffbf3d; --accent-ink:#3a2600; --line:#34376a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14152a; --shell:#1f2140; --ink:#eceeff; --muted:#a2a6cf;
  --sky1:#2b3570; --sky2:#3e4a8c; --ground:#2f4a3a;
  --accent:#ffbf3d; --accent-ink:#3a2600; --line:#34376a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-inline:16px;padding-block:16px;box-sizing:border-box}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:900;font-size:1.6rem;margin:0;letter-spacing:.02em}
#name{background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer;border-bottom:2px dashed var(--line)}
#name:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.meta{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:28px;overflow:hidden;background:var(--shell);border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(30,30,90,.5)}
canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%;cursor:pointer}
.bubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--shell);color:var(--ink);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:.88rem;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.chips{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.chip{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bad);color:#fff}
.chip.sleep{background:#5b63c9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.stat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:.85rem}
.stat b{font-weight:500;color:var(--muted);letter-spacing:.05em}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .4s,background .4s}
.stat span{font-variant-numeric:tabular-nums;width:2.2em;text-align:right;font-size:.8rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button,.game button,.confirm button{font-family:var(--display);font-weight:700;font-size:1rem;border:1px solid var(--line);background:var(--shell);color:var(--ink);border-radius:18px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s,background .2s}
.pad button small{font-family:var(--body);font-weight:400;font-size:.7rem;color:var(--muted)}
.pad button:active{transform:scale(.96)}
.pad button:focus-visible,.game button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pad button:disabled{opacity:.4;cursor:not-allowed}
.pad .hot{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pad .hot small{color:var(--accent-ink);opacity:.75}
.game,.confirm{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--shell);border:1px solid var(--line);border-radius:18px;padding:12px}
.game p,.confirm p{margin:0;width:100%;text-align:center;font-size:.9rem}
.game button,.confirm button{flex:1;min-width:100px;flex-direction:row;justify-content:center}
.log{font-size:.8rem;color:var(--muted);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;max-height:5.2em;overflow:hidden}
footer{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1><button id="name" title="點一下改名字">糰子</button></h1>
    <div class="meta"><div id="stageLbl">蛋</div><div id="age">0 分鐘</div></div>
  </header>

  <div class="stage">
    <canvas id="cv" width="800" height="600" aria-label="寵物畫面，點一下可以摸摸牠"></canvas>
    <div class="bubble" id="bubble">一顆圓滾滾的蛋……點點看？</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="stats">
    <div class="stat"><b>飽足</b><div class="bar"><i id="b-hunger"></i></div><span id="v-hunger"></span></div>
    <div class="stat"><b>心情</b><div class="bar"><i id="b-happy"></i></div><span id="v-happy"></span></div>
    <div class="stat"><b>精力</b><div class="bar"><i id="b-energy"></i></div><span id="v-energy"></span></div>
    <div class="stat"><b>清潔</b><div class="bar"><i id="b-clean"></i></div><span id="v-clean"></span></div>
  </div>

  <div class="game" id="game" hidden>
    <p id="gameMsg">牠會往哪邊看？猜猜看！</p>
    <button id="gL">← 左邊</button><button id="gR">右邊 →</button>
  </div>
  <div class="confirm" id="confirm" hidden>
    <p>確定要重新開始？目前的寵物會消失。</p>
    <button id="cYes">重新開始</button><button id="cNo">取消</button>
  </div>

  <div class="pad" id="pad">
    <button data-a="meal">餵飯<small>飽足 +35</small></button>
    <button data-a="snack">點心<small>心情 +12</small></button>
    <button data-a="play">玩遊戲<small>猜左右</small></button>
    <button data-a="bath">洗澡<small>清理便便</small></button>
    <button data-a="sleep" id="sleepBtn">關燈睡覺<small>恢復精力</small></button>
    <button data-a="doctor" id="docBtn">看醫生<small>治療生病</small></button>
  </div>

  <ul class="log" id="log"></ul>
  <footer><span>關掉頁面後牠還是會慢慢長大</span><button id="reset">重新開始</button></footer>
</div>

<script>
(function(){
const KEY='dango-pet-v1';
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
const now=()=>Date.now();
const clamp=v=>Math.max(0,Math.min(100,v));

function fresh(){return{name:'糰子',born:now(),last:now(),hatched:false,hunger:80,happy:80,energy:90,clean:100,poop:0,sleeping:false,sick:false,lowTime:0,color:Math.floor(Math.random()*4),log:[]};}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||typeof S.born!=='number')S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const COLORS=[['#ffd6e0','#f59ab3'],['#c9f0d8','#6cc895'],['#ffe6b0','#f2b94a'],['#d6dcff','#8d98ee']];

// Per-minute rates
function step(min){
  if(!S.hatched)return;
  const a=S.sleeping;
  S.hunger=clamp(S.hunger-min*(a?0.18:0.45));
  S.happy=clamp(S.happy-min*(a?0.1:0.32)-(S.poop*0.08*min)-(S.sick?0.2*min:0));
  S.clean=clamp(S.clean-min*(0.22+S.poop*0.15));
  S.energy=clamp(S.energy+min*(a?1.6:-0.3));
  if(a&&S.energy>=100){S.sleeping=false;note('睡飽了，伸個懶腰～');}
  if(!a&&Math.random()<min/28&&S.poop<4){S.poop++;}
  const low=S.hunger<15||S.clean<15||S.poop>=3;
  S.lowTime=low?S.lowTime+min:Math.max(0,S.lowTime-min);
  if(!S.sick&&S.lowTime>20){S.sick=true;note(S.name+'生病了，帶牠去看醫生吧');}
}
// Catch up on time away (max 48h)
(function(){let m=Math.min((now()-S.last)/60000,2880);
  if(!S.hatched&&now()-S.born>90000)hatch(true);
  const was={h:S.hunger,p:S.poop};
  while(m>0){const d=Math.min(m,5);step(d);m-=d;}
  if(S.hatched&&(now()-S.last)>10*60000)note('你離開了 '+fmtAge(now()-S.last)+'，牠一直在等你');
  S.last=now();})();

function hatch(silent){if(S.hatched)return;S.hatched=true;S.born=now();burst('✦');if(!silent)say('啵！蛋殼裂開了，'+S.name+'出生了！');note(S.name+'破殼而出');}

function fmtAge(ms){const m=Math.floor(ms/60000);if(m<60)return m+' 分鐘';const h=Math.floor(m/60);if(h<24)return h+' 小時 '+(m%60)+' 分';return Math.floor(h/24)+' 天 '+(h%24)+' 小時';}
function stage(){if(!S.hatched)return['蛋',0];const h=(now()-S.born)/3600000;if(h<1)return['寶寶',1];if(h<24)return['小朋友',2];if(h<72)return['少年',3];return['大人',4];}

let bubbleT=0;
function say(t){$('bubble').textContent=t;$('bubble').style.opacity=1;bubbleT=now()+3500;}
function note(t){const d=new Date();S.log.unshift(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'  '+t);S.log=S.log.slice(0,8);}

// Particles
let parts=[];
function burst(ch,n=8){for(let i=0;i<n;i++)parts.push({x:400+(Math.random()-.5)*160,y:330+(Math.random()-.5)*80,vx:(Math.random()-.5)*3,vy:-1-Math.random()*2.5,life:60+Math.random()*30,ch});}

let anim={jump:0,look:0,eat:0};
function act(a){
  if(!S.hatched){hatch();render();return;}
  if(S.sleeping&&a!=='sleep'){say('噓……牠在睡覺');return;}
  switch(a){
    case 'meal': if(S.hunger>95){say('吃不下了啦～');S.happy=clamp(S.happy-3);break;}
      S.hunger=clamp(S.hunger+35);anim.eat=60;burst('🍙',5);say('嚼嚼嚼……好吃！');note('吃了一碗飯');break;
    case 'snack': S.happy=clamp(S.happy+12);S.hunger=clamp(S.hunger+6);anim.eat=40;burst('♥',6);say('布丁！最喜歡了');note('吃了點心');break;
    case 'play': if(S.energy<15){say('好累……想睡覺');break;} openGame();return;
    case 'bath': S.clean=100;const p=S.poop;S.poop=0;burst('○',14);say(p?'清掉 '+p+' 坨便便，香噴噴！':'洗得亮晶晶！');note('洗了澡');break;
    case 'sleep': S.sleeping=!S.sleeping;say(S.sleeping?'晚安……':'起床囉！');note(S.sleeping?'去睡覺了':'被叫醒了');if(!S.sleeping)S.happy=clamp(S.happy-(S.energy<60?8:0));break;
    case 'doctor': if(!S.sick){say('牠很健康喔');break;} S.sick=false;S.lowTime=0;S.happy=clamp(S.happy-10);burst('✚',6);say('打完針了，乖！');note('看了醫生，病好了');break;
  }
  save();render();
}
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));

// Guess game
let gameRound=0,gameWins=0;
function openGame(){gameRound=0;gameWins=0;$('game').hidden=false;$('pad').hidden=true;$('gameMsg').textContent='第 1 / 3 回合：牠會往哪邊看？';}
function guess(dir){
  const pick=Math.random()<.5?-1:1;anim.look=pick*40;
  const win=pick===dir;gameRound++;if(win){gameWins++;anim.jump=30;}
  if(gameRound<3){$('gameMsg').textContent=(win?'猜中了！':'沒猜中～')+' 第 '+(gameRound+1)+' / 3 回合';}
  else{
    S.happy=clamp(S.happy+8+gameWins*7);S.energy=clamp(S.energy-12);S.hunger=clamp(S.hunger-6);
    note('玩猜左右，贏了 '+gameWins+' 次');say(gameWins>=2?'好好玩！再玩一次嘛':'下次一定會贏！');
    burst('★',gameWins*3+2);save();
    setTimeout(()=>{$('game').hidden=true;$('pad').hidden=false;render();},700);
    $('gameMsg').textContent='結果：3 回合猜中 '+gameWins+' 次';
  }
}
$('gL').onclick=()=>guess(-1);$('gR').onclick=()=>guess(1);

// Pet & rename & reset
cv.addEventListener('click',()=>{if(!S.hatched){hatch();save();return;}if(S.sleeping){say('ZZZ……');return;}S.happy=clamp(S.happy+2);anim.jump=24;burst('♥',3);say(['嘿嘿','摸摸頭～','咕嚕咕嚕','再摸一下！'][Math.floor(Math.random()*4)]);save();});
$('name').onclick=()=>{const inp=document.createElement('input');inp.id='nameInput';inp.value=S.name;inp.maxLength=8;inp.style.cssText='font:inherit;width:6em;background:var(--shell);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 6px';
  $('name').replaceWith(inp);inp.focus();inp.select();
  const done=()=>{S.name=inp.value.trim()||S.name;save();const b=document.createElement('button');b.id='name';b.title='點一下改名字';b.textContent=S.name;inp.replaceWith(b);b.onclick=$('name').onclick;location.reload();};
  inp.onblur=done;inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};};
$('reset').onclick=()=>{$('confirm').hidden=false;$('pad').hidden=true;};
$('cNo').onclick=()=>{$('confirm').hidden=true;$('pad').hidden=false;};
$('cYes').onclick=()=>{S=fresh();save();location.reload();};

function color(v){return v<25?'var(--bad)':v<50?'var(--warn)':'var(--good)';}
function render(){
  $('name').textContent=S.name;
  const [lbl]=stage();$('stageLbl').textContent=lbl;
  $('age').textContent=S.hatched?fmtAge(now()-S.born):'孵化中';
  for(const k of['hunger','happy','energy','clean']){const v=Math.round(S[k]);$('b-'+k).style.width=v+'%';$('b-'+k).style.background=color(v);$('v-'+k).textContent=v;}
  $('chips').innerHTML=(S.sick?'<span class="chip">生病</span>':'')+(S.sleeping?'<span class="chip sleep">睡覺中</span>':'');
  $('sleepBtn').firstChild.textContent=S.sleeping?'開燈起床':'關燈睡覺';
  $('docBtn').classList.toggle('hot',S.sick);
  $('pad').querySelector('[data-a=meal]').classList.toggle('hot',S.hunger<30&&!S.sick);
  $('pad').querySelector('[data-a=bath]').classList.toggle('hot',S.poop>=2);
  $('log').innerHTML=S.log.map(l=>'<li>'+l.replace(/</g,'&lt;')+'</li>').join('');
}

// Drawing
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
let t=0;
function draw(){
  t++;const W=800,H=600;const hr=new Date().getHours();const night=hr<6||hr>=19||S.sleeping;
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,night?'#1b1f4a':css('--sky1'));g.addColorStop(1,night?'#3a3f7a':css('--sky2'));
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // sun/moon
  if(night){cx.fillStyle='#fff6d0';cx.beginPath();cx.arc(660,110,38,0,7);cx.fill();cx.fillStyle='#1b1f4a';cx.beginPath();cx.arc(678,98,34,0,7);cx.fill();
    cx.fillStyle='#fff';for(let i=0;i<14;i++){const x=(i*137)%760+20,y=(i*71)%220+20;cx.globalAlpha=.4+.4*Math.sin(t/30+i);cx.fillRect(x,y,3,3);}cx.globalAlpha=1;}
  else{cx.fillStyle='#ffd45c';cx.beginPath();cx.arc(660,110,42,0,7);cx.fill();
    cx.fillStyle='rgba(255,255,255,.85)';const cxp=(t*.3)%1000-150;[[cxp,140],[cxp+60,125],[cxp+110,145]].forEach(([x,y])=>{cx.beginPath();cx.arc(x,y,34,0,7);cx.fill();});}
  // ground
  cx.fillStyle=night?'#2b4a3c':css('--ground');cx.beginPath();cx.ellipse(400,640,560,200,0,0,7);cx.fill();

  // poop
  for(let i=0;i<S.poop;i++){const x=[150,640,230,560][i],y=[500,505,530,532][i];
    cx.fillStyle='#8a5a3b';[[0,0,22],[0,-14,16],[0,-26,10]].forEach(([dx,dy,r])=>{cx.beginPath();cx.ellipse(x+dx,y+dy,r,r*.7,0,0,7);cx.fill();});
    if(!S.sleeping){cx.strokeStyle='rgba(120,140,80,.6)';cx.lineWidth=3;cx.beginPath();for(let k=0;k<3;k++){const ox=x-14+k*14,yy=y-50-((t+k*20)%40);cx.moveTo(ox,yy);cx.quadraticCurveTo(ox+6,yy-8,ox,yy-16);}cx.stroke();}}

  const [,st]=stage();
  if(!S.hatched){drawEgg();}else drawPet(st);

  // particles
  parts=parts.filter(p=>p.life-->0);cx.textAlign='center';cx.font='bold 34px sans-serif';
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.ch==='♥'?'#ff6b8a':p.ch==='★'?'#ffb21f':p.ch==='○'?'#7fc6ff':'#fff';cx.fillText(p.ch,p.x,p.y);});cx.globalAlpha=1;
  if(S.sleeping){cx.fillStyle='rgba(10,10,40,.25)';cx.fillRect(0,0,W,H);}
  if(bubbleT&&now()>bubbleT){$('bubble').style.opacity=0;bubbleT=0;}
  requestAnimationFrame(draw);
}
function drawEgg(){const w=Math.sin(t/8)*(t%180<40?0.08:0.015);cx.save();cx.translate(400,470);cx.rotate(w);
  cx.fillStyle='rgba(0,0,0,.12)';cx.beginPath();cx.ellipse(0,10,90,18,0,0,7);cx.fill();
  cx.fillStyle='#fffaf0';cx.beginPath();cx.ellipse(0,-100,90,115,0,0,7);cx.fill();
  cx.fillStyle=COLORS[S.color][1];[[-40,-140,16],[30,-90,20],[-20,-50,12],[45,-170,10]].forEach(([x,y,r])=>{cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();});
  const prog=Math.min(1,(now()-S.born)/90000);if(prog>.4){cx.strokeStyle='#6b5a40';cx.lineWidth=4;cx.beginPath();cx.moveTo(-50,-110);cx.lineTo(-25,-95);cx.lineTo(-5,-115);if(prog>.7){cx.lineTo(18,-92);cx.lineTo(40,-112);}cx.stroke();}
  cx.restore();if(prog>=1&&!S.hatched){hatch();save();render();}}
function drawPet(st){
  const sz=[0,70,92,110,125][st];const [fill,edge]=COLORS[S.color];
  const mood=S.sick?'sick':S.sleeping?'sleep':(S.happy<30||S.hunger<20)?'sad':S.happy>70?'happy':'ok';
  if(anim.jump>0)anim.jump--;if(anim.eat>0)anim.eat--;anim.look*=.96;
  const bob=S.sleeping?Math.sin(t/40)*3:Math.sin(t/12)*5;const jy=anim.jump?-Math.sin(anim.jump/30*Math.PI)*60:0;
  const walk=S.sleeping||mood==='sick'?0:Math.sin(t/140)*90;
  const x=400+walk+anim.look,y=480+jy;const sq=1+Math.sin(t/12)*.03;
  cx.fillStyle='rgba(0,0,0,.13)';cx.beginPath();cx.ellipse(x,492,sz*.9,sz*.18,0,0,7);cx.fill();
  cx.save();cx.translate(x,y+bob*.3);cx.scale(1/sq,sq);
  // body
  cx.fillStyle=mood==='sick'?'#d8e6c0':fill;cx.strokeStyle=edge;cx.lineWidth=6;
  cx.beginPath();cx.moveTo(-sz,0);cx.bezierCurveTo(-sz,-sz*1.5,sz,-sz*1.5,sz,0);cx.quadraticCurveTo(0,sz*.18,-sz,0);cx.fill();cx.stroke();
  // ears / sprout by stage
  if(st>=2){cx.fillStyle=edge;cx.beginPath();cx.ellipse(-sz*.55,-sz*1.02,sz*.16,sz*.26,-.5,0,7);cx.ellipse(sz*.55,-sz*1.02,sz*.16,sz*.26,.5,0,7);cx.fill();}
  else{cx.strokeStyle='#5aa860';cx.lineWidth=5;cx.beginPath();cx.moveTo(0,-sz*1.1);cx.quadraticCurveTo(8,-sz*1.35,0,-sz*1.5);cx.stroke();cx.fillStyle='#7ccf7f';cx.beginPath();cx.ellipse(14,-sz*1.45,14,8,-.4,0,7);cx.fill();}
  if(st>=4){cx.fillStyle='#ffb21f';cx.beginPath();cx.moveTo(-22,-sz*1.12);cx.lineTo(-12,-sz*1.36);cx.lineTo(0,-sz*1.18);cx.lineTo(12,-sz*1.36);cx.lineTo(22,-sz*1.12);cx.closePath();cx.fill();}
  // face
  const ex=sz*.36,ey=-sz*.55,lx=anim.look*.15;cx.fillStyle='#2a2440';cx.strokeStyle='#2a2440';cx.lineWidth=5;cx.lineCap='round';
  const blink=(t%200)<6;
  if(mood==='sleep'||blink){[-1,1].forEach(s=>{cx.beginPath();cx.arc(s*ex+lx,ey,10,.15*Math.PI,.85*Math.PI);cx.stroke();});}
  else if(mood==='happy'){[-1,1].forEach(s=>{cx.beginPath();cx.arc(s*ex+lx,ey+6,11,1.15*Math.PI,1.85*Math.PI);cx.stroke();});}
  else if(mood==='sick'){[-1,1].forEach(s=>{cx.beginPath();cx.moveTo(s*ex-9,ey-9);cx.lineTo(s*ex+9,ey+9);cx.moveTo(s*ex+9,ey-9);cx.lineTo(s*ex-9,ey+9);cx.stroke();});}
  else{[-1,1].forEach(s=>{cx.beginPath();cx.arc(s*ex+lx,ey,9,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(s*ex+lx+3,ey-3,3,0,7);cx.fill();cx.fillStyle='#2a2440';});}
  cx.fillStyle='rgba(255,110,140,.45)';[-1,1].forEach(s=>{cx.beginPath();cx.ellipse(s*sz*.6,-sz*.36,sz*.12,sz*.07,0,0,7);cx.fill();});
  cx.beginPath();
  if(anim.eat>0){const o=Math.abs(Math.sin(anim.eat/4))*10+3;cx.ellipse(0,-sz*.32,10,o,0,0,7);cx.fill();}
  else if(mood==='happy'){cx.arc(0,-sz*.38,12,.1*Math.PI,.9*Math.PI);cx.stroke();}
  else if(mood==='sad'||mood==='sick'){cx.arc(0,-sz*.22,11,1.15*Math.PI,1.85*Math.PI);cx.stroke();}
  else if(mood==='sleep'){cx.ellipse(0,-sz*.3,5,4,0,0,7);cx.fill();}
  else{cx.moveTo(-8,-sz*.32);cx.lineTo(8,-sz*.32);cx.stroke();}
  cx.restore();
  if(mood==='sleep'){cx.fillStyle='#fff';cx.font='bold 30px sans-serif';for(let i=0;i<3;i++){const p=((t/2+i*40)%120)/120;cx.globalAlpha=1-p;cx.fillText('Z',x+sz*.7+p*50,y-sz*1.2-p*80);}cx.globalAlpha=1;}
  if(mood==='sad'&&t%300===0)say(S.hunger<20?'肚子好餓……':'好無聊喔……');
}

setInterval(()=>{const m=(now()-S.last)/60000;step(m);S.last=now();save();render();},1000);
render();draw();
})();
</script>
